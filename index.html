<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>實現排版自由 🎉</title>
     <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #020617; 
            color: white;
            overscroll-behavior-y: contain;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        .selected-object {
            outline: 4px solid #38bdf8;
            outline-offset: -2px;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
        }

        .menu-overlay {
            background: rgba(2, 6, 23, 0.7);
            backdrop-filter: blur(4px);
        }

        .library-drawer {
            background: linear-gradient(to top, #020617, #0f172a);
            border-top: 1px solid rgba(56, 189, 248, 0.2);
        }

        /* 按鈕點擊效果 */
        .btn-active:active {
            transform: scale(0.9);
            filter: brightness(1.2);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useLayoutEffect } = React;

        const Icon = ({ name, size = 16, className = "" }) => {
            const icons = {
                'upload': <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></>,
                'download': <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>,
                'trash-2': <><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>,
                'copy': <><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>,
                'smartphone': <><rect width="10" height="14" x="7" y="5" rx="2" ry="2"/><line x1="12" x2="12" y1="18" y2="18"/></>,
                'monitor': <><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></>,
                'undo-2': <><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></>,
                'rotate-cw': <><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></>,
                'x': <><path d="M18 6 6 18"/><path d="M6 6l12 12"/></>,
                'image': <><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></>,
                'plus': <><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></>
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const App = () => {
            const [uploadedImages, setUploadedImages] = useState([]); 
            const [canvasObjects, setCanvasObjects] = useState([]);   
            const [history, setHistory] = useState([]); 
            const [selectedId, setSelectedId] = useState(null);       
            const [draggingId, setDraggingId] = useState(null);
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
            const [isPortrait, setIsPortrait] = useState(true);
            const [scaleFactor, setScaleFactor] = useState(1); 
            
            const canvasRef = useRef(null);
            const boardRef = useRef(null);
            const containerRef = useRef(null);

            const BASE_WIDTH = 595;
            const BASE_HEIGHT = 842;
            const A4_WIDTH = isPortrait ? BASE_WIDTH : BASE_HEIGHT;
            const A4_HEIGHT = isPortrait ? BASE_HEIGHT : BASE_WIDTH;

            const saveHistory = (currentObjects) => {
                setHistory(prev => {
                    const newHistory = [JSON.stringify(currentObjects), ...prev];
                    return newHistory.slice(0, 20);
                });
            };

            const handleUndo = () => {
                if (history.length === 0) return;
                const [lastState, ...remainingHistory] = history;
                setCanvasObjects(JSON.parse(lastState));
                setHistory(remainingHistory);
            };

            const calculateSmartSize = (type, currentPaperPortrait, isManualRotated = false) => {
                const pW = currentPaperPortrait ? BASE_WIDTH : BASE_HEIGHT;
                const pH = currentPaperPortrait ? BASE_HEIGHT : BASE_WIDTH;
                let w, h;
                switch (type) {
                    case '1': w = pW; h = pH; break;
                    case '1/2': if (currentPaperPortrait) { w = pW; h = pH / 2; } else { w = pW / 2; h = pH; } break;
                    case '1/4': w = pW / 2; h = pH / 2; break;
                    case '1/8': if (currentPaperPortrait) { w = pW / 2; h = pH / 4; } else { w = pW / 4; h = pH / 2; } break;
                    default: w = pW / 4; h = pH / 4;
                }
                if (isManualRotated) return { width: h, height: w };
                return { width: w, height: h };
            };

            const getBestImageRotation = (imgW, imgH, boxW, boxH) => {
                const scale0 = Math.min(boxW / imgW, boxH / imgH);
                const scale90 = Math.min(boxW / imgH, boxH / imgW);
                return scale90 > scale0 ? 90 : 0;
            };

            useEffect(() => {
                setCanvasObjects(prev => prev.map(obj => {
                    const { width, height } = calculateSmartSize(obj.type, isPortrait, obj.isManualRotated);
                    const bestRot = getBestImageRotation(obj.imgW, obj.imgH, width, height);
                    const newX = Math.min(obj.x, A4_WIDTH - width);
                    const newY = Math.min(obj.y, A4_HEIGHT - height);
                    return { ...obj, width, height, imgRotation: bestRot, x: Math.max(0, newX), y: Math.max(0, newY) };
                }));
            }, [isPortrait]);

            useLayoutEffect(() => {
                const updateScale = () => {
                    if (containerRef.current) {
                        const padding = 40; 
                        const availableW = containerRef.current.offsetWidth - padding;
                        const availableH = containerRef.current.offsetHeight - padding;
                        const scaleW = availableW / A4_WIDTH;
                        const scaleH = availableH / A4_HEIGHT;
                        setScaleFactor(Math.min(scaleW, scaleH)); 
                    }
                };
                window.addEventListener('resize', updateScale);
                updateScale();
                return () => window.removeEventListener('resize', updateScale);
            }, [A4_WIDTH, A4_HEIGHT]);

            const handleFileUpload = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            setUploadedImages(prev => [{ 
                                id: Date.now() + Math.random(), 
                                url: event.target.result, 
                                w: img.width, 
                                h: img.height 
                            }, ...prev]);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const addLayer = (imgAsset) => {
                saveHistory(canvasObjects);
                const type = '1/4';
                const size = calculateSmartSize(type, isPortrait, false);
                const bestImgRot = getBestImageRotation(imgAsset.w, imgAsset.h, size.width, size.height);
                const newLayer = {
                    id: Date.now() + Math.random(),
                    url: imgAsset.url,
                    imgW: imgAsset.w, imgH: imgAsset.h,
                    x: (A4_WIDTH - size.width) / 2, y: (A4_HEIGHT - size.height) / 2,
                    width: size.width, height: size.height,
                    type, isManualRotated: false, imgRotation: bestImgRot
                };
                setCanvasObjects(prev => [newLayer, ...prev]);
                setSelectedId(newLayer.id);
            };

            const handleMouseDown = (e, id) => {
                e.stopPropagation();
                setSelectedId(id);
                saveHistory(canvasObjects);
                const rect = boardRef.current.getBoundingClientRect();
                const obj = canvasObjects.find(o => o.id === id);
                setDraggingId(id);
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                setDragOffset({
                    x: (clientX - rect.left) / scaleFactor - obj.x,
                    y: (clientY - rect.top) / scaleFactor - obj.y
                });
            };

            const handleMouseMove = (e) => {
                if (!draggingId) return;
                const rect = boardRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                let newX = (clientX - rect.left) / scaleFactor - dragOffset.x;
                let newY = (clientY - rect.top) / scaleFactor - dragOffset.y;
                const obj = canvasObjects.find(o => o.id === draggingId);
                
                const snap = 10;
                if (Math.abs(newX) < snap) newX = 0;
                if (Math.abs(newX - (A4_WIDTH - obj.width)) < snap) newX = A4_WIDTH - obj.width;
                if (Math.abs(newY) < snap) newY = 0;
                if (Math.abs(newY - (A4_HEIGHT - obj.height)) < snap) newY = A4_HEIGHT - obj.height;

                setCanvasObjects(prev => prev.map(o => o.id === draggingId ? { ...o, x: newX, y: newY } : o));
            };

            const handleMouseUp = () => setDraggingId(null);

            const updateType = (id, newType) => {
                saveHistory(canvasObjects);
                setCanvasObjects(prev => prev.map(o => {
                    if (o.id === id) {
                        const { width, height } = calculateSmartSize(newType, isPortrait, o.isManualRotated);
                        const bestRot = getBestImageRotation(o.imgW, o.imgH, width, height);
                        return { ...o, type: newType, width, height, imgRotation: bestRot };
                    }
                    return o;
                }));
            };

            const toggleRotate = (id) => {
                saveHistory(canvasObjects);
                setCanvasObjects(prev => prev.map(o => {
                    if (o.id === id) {
                        const newState = !o.isManualRotated;
                        const { width, height } = calculateSmartSize(o.type, isPortrait, newState);
                        const bestRot = getBestImageRotation(o.imgW, o.imgH, width, height);
                        return { ...o, isManualRotated: newState, width, height, imgRotation: bestRot };
                    }
                    return o;
                }));
            };

            const removeLayer = (id) => {
                saveHistory(canvasObjects);
                setCanvasObjects(prev => prev.filter(obj => obj.id !== id));
                if (selectedId === id) setSelectedId(null);
            };

            const downloadJPG = () => {
                const canvas = canvasRef.current;
                const exportW = isPortrait ? 2480 : 3508;
                const exportH = isPortrait ? 3508 : 2480;
                const scale = exportW / A4_WIDTH;
                canvas.width = exportW; canvas.height = exportH;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, exportW, exportH);
                let loaded = 0;
                [...canvasObjects].reverse().forEach(obj => {
                    const img = new Image(); img.src = obj.url;
                    img.onload = () => {
                        const dW = obj.width * scale; const dH = obj.height * scale;
                        const isRot = (obj.imgRotation / 90) % 2 !== 0;
                        const imgScale = Math.min(dW / (isRot ? obj.imgH : obj.imgW), dH / (isRot ? obj.imgW : obj.imgH));
                        ctx.save();
                        ctx.translate(obj.x * scale + dW/2, obj.y * scale + dH/2);
                        ctx.rotate((obj.imgRotation * Math.PI) / 180);
                        ctx.drawImage(img, -obj.imgW * imgScale / 2, -obj.imgH * imgScale / 2, obj.imgW * imgScale, obj.imgH * imgScale);
                        ctx.restore();
                        if (++loaded === canvasObjects.length) {
                            const a = document.createElement('a'); a.download = `Layout_Export.jpg`;
                            a.href = canvas.toDataURL('image/jpeg', 0.9); a.click();
                        }
                    };
                });
            };

            return (
                <div className="flex flex-col h-screen overflow-hidden bg-[#020617] select-none touch-none">
                    {/* 頂部控制列 */}
                    <header className="h-14 bg-slate-900/90 border-b border-sky-900/30 flex items-center justify-between px-4 z-[60] backdrop-blur-md">
                        <div className="flex items-center gap-3">
                            <h1 className="text-lg font-bold text-sky-400 tracking-tighter">實現排版自由 🎉</h1>
                            <label className="flex items-center gap-1.5 px-3 py-1.5 bg-sky-500/10 border border-sky-400/30 rounded-lg cursor-pointer hover:bg-sky-500/20 active:scale-95 transition-all">
                                <Icon name="upload" size={14} className="text-sky-300" />
                                <span className="text-xs font-bold text-sky-200">上傳</span>
                                <input type="file" className="hidden" multiple accept="image/*" onChange={handleFileUpload} />
                            </label>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={handleUndo} disabled={history.length === 0} className={`p-2 rounded-lg border border-slate-700 transition-all ${history.length > 0 ? 'bg-slate-800 text-sky-400 active:scale-90' : 'opacity-20'}`}>
                                <Icon name="undo-2" size={18} />
                            </button>
                            <div className="flex p-0.5 bg-slate-950 rounded-lg border border-slate-800">
                                <button onClick={() => setIsPortrait(true)} className={`p-1.5 rounded-md ${isPortrait ? 'bg-sky-500 text-white shadow-lg' : 'text-slate-500'}`}><Icon name="smartphone" size={16} /></button>
                                <button onClick={() => setIsPortrait(false)} className={`p-1.5 rounded-md ${!isPortrait ? 'bg-sky-500 text-white shadow-lg' : 'text-slate-500'}`}><Icon name="monitor" size={16} /></button>
                            </div>
                            <button onClick={downloadJPG} className="bg-sky-500 hover:bg-sky-400 text-slate-950 font-black px-4 py-1.5 rounded-full text-xs shadow-lg active:scale-95 transition-all">
                                匯出
                            </button>
                        </div>
                    </header>

                    {/* 中央畫布 */}
                    <main 
                        ref={containerRef} 
                        className="flex-1 relative flex items-center justify-center p-4 bg-slate-950 overflow-hidden"
                        onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onTouchMove={handleMouseMove} onTouchEnd={handleMouseUp}
                        onClick={() => setSelectedId(null)}
                    >
                        <div 
                            ref={boardRef} 
                            className="bg-white shadow-[0_20px_100px_rgba(0,0,0,0.8)] relative transition-transform duration-300 ease-out flex-shrink-0" 
                            style={{ width: `${A4_WIDTH}px`, height: `${A4_HEIGHT}px`, transform: `scale(${scaleFactor})`, transformOrigin: 'center' }}
                        >
                            <div className="absolute inset-0 pointer-events-none opacity-[0.03]" style={{ backgroundImage: `linear-gradient(#000 1.5px, transparent 1.5px), linear-gradient(90deg, #000 1.5px, transparent 1.5px)`, backgroundSize: `${A4_WIDTH/4}px ${A4_HEIGHT/8}px` }}></div>
                            
                            {[...canvasObjects].reverse().map(obj => (
                                <div 
                                    key={obj.id} 
                                    onMouseDown={(e) => handleMouseDown(e, obj.id)} 
                                    onTouchStart={(e) => handleMouseDown(e, obj.id)}
                                    onClick={(e) => e.stopPropagation()}
                                    className={`absolute cursor-move select-none transition-all ${selectedId === obj.id ? 'selected-object z-50' : 'hover:outline hover:outline-2 hover:outline-sky-400/30'}`} 
                                    style={{ 
                                        left: `${obj.x}px`, 
                                        top: `${obj.y}px`, 
                                        width: `${obj.width}px`, 
                                        height: `${obj.height}px`,
                                        transition: draggingId === obj.id ? 'none' : 'width 0.2s, height 0.2s, transform 0.2s'
                                    }}
                                >
                                    <div className="w-full h-full bg-slate-100 flex items-center justify-center overflow-hidden relative">
                                        <img 
                                            src={obj.url} 
                                            className="pointer-events-none" 
                                            style={{
                                                width: `${obj.imgW}px`, height: `${obj.imgH}px`,
                                                transform: `rotate(${obj.imgRotation}deg) scale(${Math.min(obj.width / ((obj.imgRotation/90)%2?obj.imgH:obj.imgW), obj.height / ((obj.imgRotation/90)%2?obj.imgW:obj.imgH))})`,
                                                maxWidth: 'none', position: 'absolute'
                                            }}
                                        />

                                        {/* 全覆蓋操作選單 */}
                                        {selectedId === obj.id && (
                                            <div 
                                                className="menu-overlay absolute inset-0 flex flex-col items-center justify-center gap-4 p-2 z-[110] animate-in fade-in duration-200"
                                                onMouseDown={(e) => {
                                                    // 核心修正：如果點擊的是選單背景而非按鈕，則允許執行父元件的拖拽邏輯
                                                    if (e.target === e.currentTarget) {
                                                        // 不停止冒泡，讓父級 div 捕獲 handleMouseDown
                                                    } else {
                                                        e.stopPropagation();
                                                    }
                                                }}
                                                onTouchStart={(e) => {
                                                    if (e.target === e.currentTarget) {
                                                        // 同上，不停止冒泡
                                                    } else {
                                                        e.stopPropagation();
                                                    }
                                                }}
                                            >
                                                {/* 尺寸選擇區 */}
                                                <div className="grid grid-cols-4 gap-2 w-full max-w-[280px]">
                                                    {['1', '1/2', '1/4', '1/8'].map(t => (
                                                        <button 
                                                            key={t}
                                                            onClick={(e) => { e.stopPropagation(); updateType(obj.id, t); }}
                                                            className={`h-12 flex items-center justify-center rounded-xl text-xs font-black btn-active transition-all ${obj.type === t ? 'bg-sky-500 text-white shadow-[0_0_15px_rgba(56,189,248,0.5)]' : 'bg-slate-900/80 text-sky-200 border border-sky-400/20'}`}
                                                        >
                                                            {t}
                                                        </button>
                                                    ))}
                                                </div>

                                                {/* 功能操作區 */}
                                                <div className="flex items-center gap-2 w-full max-w-[280px]">
                                                    <button onClick={(e) => { e.stopPropagation(); toggleRotate(obj.id); }} className="flex-1 h-12 flex items-center justify-center bg-slate-900/80 text-sky-400 border border-sky-400/20 rounded-xl btn-active">
                                                        <Icon name="rotate-cw" size={24} />
                                                    </button>
                                                    <button onClick={(e) => { e.stopPropagation(); saveHistory(canvasObjects); setCanvasObjects(prev => [ { ...obj, id: Date.now(), x: obj.x+20, y: obj.y+20 }, ...prev ]); }} className="flex-1 h-12 flex items-center justify-center bg-slate-900/80 text-emerald-400 border border-emerald-400/20 rounded-xl btn-active">
                                                        <Icon name="copy" size={24} />
                                                    </button>
                                                    <button onClick={(e) => { e.stopPropagation(); removeLayer(obj.id); }} className="flex-1 h-12 flex items-center justify-center bg-rose-500/20 text-rose-400 border border-rose-500/50 rounded-xl btn-active">
                                                        <Icon name="trash-2" size={24} />
                                                    </button>
                                                </div>
                                                
                                                <div className="text-[10px] text-sky-400/30 font-black tracking-[0.2em] uppercase mt-1">
                                                    拖曳空白處可移動
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}

                            {canvasObjects.length === 0 && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-200 pointer-events-none opacity-[0.05]">
                                    <Icon name="image" size={100} />
                                    <p className="text-xl font-bold tracking-[0.2em] mt-4 uppercase text-center px-4">上傳並點選下方照片<br/>開始您的排版</p>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* 底部資源庫 */}
                    <footer className="library-drawer h-24 shrink-0 flex flex-col z-50">
                        <div className="px-4 py-2 flex items-center justify-between border-b border-slate-800/30">
                            <h2 className="text-sm font-bold text-sky-400 uppercase tracking-widest flex items-center gap-2">
                                <div className="w-1.5 h-3.5 bg-sky-500 rounded-full"></div> 資源庫
                            </h2>
                            <span className="text-[10px] font-black text-slate-500 uppercase tracking-tighter">STOCK: {uploadedImages.length}</span>
                        </div>
                        <div className="flex-1 overflow-x-auto overflow-y-hidden scrollbar-hide flex items-center px-4 gap-3">
                            {uploadedImages.map(img => (
                                <div 
                                    key={img.id} 
                                    onClick={() => addLayer(img)} 
                                    className="h-14 aspect-square rounded-xl overflow-hidden bg-slate-800/50 border border-slate-700/50 flex-shrink-0 active:scale-90 transition-all shadow-lg cursor-pointer group relative"
                                >
                                    <img src={img.url} className="w-full h-full object-cover opacity-70 group-hover:opacity-100" />
                                    <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-sky-500/20">
                                        <div className="p-1 bg-sky-500 rounded-full shadow-lg"><Icon name="plus" size={10} className="text-white" /></div>
                                    </div>
                                </div>
                            ))}
                            {uploadedImages.length === 0 && (
                                <div className="flex-1 flex items-center justify-center text-slate-700 italic text-[10px] tracking-widest uppercase">
                                    請上傳照片至此處
                                </div>
                            )}
                        </div>
                    </footer>

                    <canvas ref={canvasRef} className="hidden" />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
