<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧 A4 排版編輯器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 核心修復：確保 React 全域可用 -->
    <script>
        window.React = React;
        window.ReactDOM = ReactDOM;
    </script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide 核心庫 (非 React 版本，避免 UMD 綁定錯誤與 Infinity 命名衝突) -->
    <script src="https://unpkg.com/lucide@0.284.0/dist/lucide.min.js"></script>
    
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        body { margin: 0; padding: 0; background-color: #020617; color: white; }
        .icon-container svg { display: block; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useLayoutEffect } = React;

        /**
         * 自定義 Icon 組件
         * 使用 Lucide 核心庫生成的 SVG 以確保穩定性
         */
        const Icon = ({ name, size = 20, className = "" }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                if (containerRef.current && window.lucide) {
                    // lucide.icons 存儲了所有圖示定義
                    // 核心庫使用的是 camelCase 或對應的物件 key
                    const iconKey = name.split('-').map((part, i) => 
                        i === 0 ? part : part.charAt(0).toUpperCase() + part.slice(1)
                    ).join('');
                    
                    const icon = window.lucide.icons[iconKey] || window.lucide.icons[name];
                    
                    if (icon) {
                        containerRef.current.innerHTML = icon.toSvg({
                            width: size,
                            height: size,
                            class: className,
                            'stroke-width': 2
                        });
                    }
                }
            }, [name, size, className]);

            return <span ref={containerRef} className={`inline-flex items-center justify-center icon-container ${className}`} />;
        };

        const App = () => {
            const [uploadedImages, setUploadedImages] = useState([]); 
            const [canvasObjects, setCanvasObjects] = useState([]);   
            const [history, setHistory] = useState([]); 
            const [selectedId, setSelectedId] = useState(null);       
            const [draggingId, setDraggingId] = useState(null);
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
            const [isPortrait, setIsPortrait] = useState(true);
            const [scaleFactor, setScaleFactor] = useState(1); 
            
            const canvasRef = useRef(null);
            const boardRef = useRef(null);
            const containerRef = useRef(null);

            const BASE_WIDTH = 595;
            const BASE_HEIGHT = 842;
            const A4_WIDTH = isPortrait ? BASE_WIDTH : BASE_HEIGHT;
            const A4_HEIGHT = isPortrait ? BASE_HEIGHT : BASE_WIDTH;

            const saveHistory = (currentObjects) => {
                setHistory(prev => {
                    const newHistory = [JSON.stringify(currentObjects), ...prev];
                    return newHistory.slice(0, 20);
                });
            };

            const handleUndo = () => {
                if (history.length === 0) return;
                const [lastState, ...remainingHistory] = history;
                setCanvasObjects(JSON.parse(lastState));
                setHistory(remainingHistory);
            };

            const getBestImageRotation = (imgW, imgH, boxW, boxH) => {
                const scale0 = Math.min(boxW / imgW, boxH / imgH);
                const scale90 = Math.min(boxW / imgH, boxH / imgW);
                return scale90 > scale0 ? 90 : 0;
            };

            const calculateSmartSize = (type, currentPaperPortrait, isManualRotated = false) => {
                const pW = currentPaperPortrait ? BASE_WIDTH : BASE_HEIGHT;
                const pH = currentPaperPortrait ? BASE_HEIGHT : BASE_WIDTH;
                let w, h;
                switch (type) {
                    case '1': w = pW; h = pH; break;
                    case '1/2': 
                        if (currentPaperPortrait) { w = pW; h = pH / 2; }
                        else { w = pW / 2; h = pH; }
                        break;
                    case '1/4': w = pW / 2; h = pH / 2; break;
                    case '1/8':
                        if (currentPaperPortrait) { w = pW / 2; h = pH / 4; }
                        else { w = pW / 4; h = pH / 2; }
                        break;
                    default: w = pW / 4; h = pH / 4;
                }
                if (isManualRotated) return { width: h, height: w };
                return { width: w, height: h };
            };

            useEffect(() => {
                setCanvasObjects(prev => prev.map(obj => {
                    const { width, height } = calculateSmartSize(obj.type, isPortrait, obj.isManualRotated);
                    const bestRot = getBestImageRotation(obj.imgW, obj.imgH, width, height);
                    const newX = Math.min(obj.x, A4_WIDTH - width);
                    const newY = Math.min(obj.y, A4_HEIGHT - height);
                    return { 
                        ...obj, 
                        width, 
                        height, 
                        imgRotation: bestRot, 
                        x: Math.max(0, newX), 
                        y: Math.max(0, newY) 
                    };
                }));
            }, [isPortrait]);

            useLayoutEffect(() => {
                const updateScale = () => {
                    if (containerRef.current) {
                        const padding = 80; 
                        const availableW = containerRef.current.offsetWidth - padding;
                        const availableH = containerRef.current.offsetHeight - padding;
                        const scaleW = availableW / A4_WIDTH;
                        const scaleH = availableH / A4_HEIGHT;
                        const finalScale = Math.min(scaleW, scaleH);
                        setScaleFactor(finalScale > 1 ? 1 : finalScale); 
                    }
                };
                const observer = new ResizeObserver(updateScale);
                if (containerRef.current) observer.observe(containerRef.current);
                updateScale();
                return () => observer.disconnect();
            }, [A4_WIDTH, A4_HEIGHT, isPortrait]);

            const handleFileUpload = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            setUploadedImages(prev => [...prev, { 
                                id: Date.now() + Math.random(), 
                                url: event.target.result, 
                                w: img.width, 
                                h: img.height 
                            }]);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const addLayer = (imgAsset, type = '1/4') => {
                saveHistory(canvasObjects);
                const initialSize = calculateSmartSize(type, isPortrait, false);
                const isImgLandscape = imgAsset.w > imgAsset.h;
                const isBoxLandscape = initialSize.width > initialSize.height;
                const shouldRotateGrid = (type !== '1' && type !== '1/4' && isImgLandscape !== isBoxLandscape);
                const finalSize = shouldRotateGrid ? { width: initialSize.height, height: initialSize.width } : initialSize;
                const bestImgRot = getBestImageRotation(imgAsset.w, imgAsset.h, finalSize.width, finalSize.height);

                const newLayer = {
                    id: Date.now() + Math.random(),
                    url: imgAsset.url,
                    imgW: imgAsset.w,
                    imgH: imgAsset.h,
                    x: (A4_WIDTH - finalSize.width) / 2,
                    y: (A4_HEIGHT - finalSize.height) / 2,
                    width: finalSize.width,
                    height: finalSize.height,
                    type,
                    isManualRotated: shouldRotateGrid,
                    imgRotation: bestImgRot
                };
                setCanvasObjects(prev => [newLayer, ...prev]);
                setSelectedId(newLayer.id);
            };

            const duplicateLayer = (layer) => {
                saveHistory(canvasObjects);
                const newLayer = {
                    ...layer,
                    id: Date.now() + Math.random(),
                    x: Math.min(layer.x + 20, A4_WIDTH - layer.width),
                    y: Math.min(layer.y + 20, A4_HEIGHT - layer.height)
                };
                setCanvasObjects(prev => [newLayer, ...prev]);
                setSelectedId(newLayer.id);
            };

            const updateLayerType = (id, newType) => {
                saveHistory(canvasObjects);
                setCanvasObjects(prev => prev.map(obj => {
                    if (obj.id === id) {
                        const { width, height } = calculateSmartSize(newType, isPortrait, obj.isManualRotated);
                        const bestRot = getBestImageRotation(obj.imgW, obj.imgH, width, height);
                        return { ...obj, type: newType, width, height, imgRotation: bestRot };
                    }
                    return obj;
                }));
            };

            const toggleRotateGrid = (e, id) => {
                e.stopPropagation();
                saveHistory(canvasObjects);
                setCanvasObjects(prev => prev.map(obj => {
                    if (obj.id === id) {
                        const newState = !obj.isManualRotated;
                        const { width, height } = calculateSmartSize(obj.type, isPortrait, newState);
                        const bestRot = getBestImageRotation(obj.imgW, obj.imgH, width, height);
                        const newX = Math.min(obj.x, A4_WIDTH - width);
                        const newY = Math.min(obj.y, A4_HEIGHT - height);
                        return { ...obj, isManualRotated: newState, width, height, imgRotation: bestRot, x: Math.max(0, newX), y: Math.max(0, newY) };
                    }
                    return obj;
                }));
            };

            const removeLayer = (id) => {
                saveHistory(canvasObjects);
                setCanvasObjects(prev => prev.filter(obj => obj.id !== id));
                if (selectedId === id) setSelectedId(null);
            };

            const handleMouseDown = (e, id) => {
                e.stopPropagation();
                setSelectedId(id);
                saveHistory(canvasObjects);
                const rect = boardRef.current.getBoundingClientRect();
                const obj = canvasObjects.find(o => o.id === id);
                setDraggingId(id);
                setDragOffset({
                    x: (e.clientX - rect.left) / scaleFactor - obj.x,
                    y: (e.clientY - rect.top) / scaleFactor - obj.y
                });
            };

            const handleMouseMove = (e) => {
                if (!draggingId) return;
                const rect = boardRef.current.getBoundingClientRect();
                let newX = (e.clientX - rect.left) / scaleFactor - dragOffset.x;
                let newY = (e.clientY - rect.top) / scaleFactor - dragOffset.y;
                const draggingObj = canvasObjects.find(o => o.id === draggingId);
                if (!draggingObj) return;

                const snapThreshold = 12;
                [0, A4_WIDTH / 2, A4_WIDTH - draggingObj.width].forEach(snap => {
                    if (Math.abs(newX - snap) < snapThreshold) newX = snap;
                });
                [0, A4_HEIGHT / 2, A4_HEIGHT - draggingObj.height].forEach(snap => {
                    if (Math.abs(newY - snap) < snapThreshold) newY = snap;
                });

                newX = Math.max(0, Math.min(newX, A4_WIDTH - draggingObj.width));
                newY = Math.max(0, Math.min(newY, A4_HEIGHT - draggingObj.height));

                setCanvasObjects(prev => prev.map(obj => 
                    obj.id === draggingId ? { ...obj, x: newX, y: newY } : obj
                ));
            };

            const handleMouseUp = () => setDraggingId(null);

            const getPreviewImageStyle = (obj) => {
                const isRotated = (obj.imgRotation / 90) % 2 !== 0;
                const effectiveImgW = isRotated ? obj.imgH : obj.imgW;
                const effectiveImgH = isRotated ? obj.imgW : obj.imgH;
                const scale = Math.min(obj.width / effectiveImgW, obj.height / effectiveImgH);

                return {
                    width: `${obj.imgW}px`,
                    height: `${obj.imgH}px`,
                    transform: `translate(-50%, -50%) rotate(${obj.imgRotation}deg) scale(${scale})`,
                    position: 'absolute',
                    left: '50%',
                    top: '50%',
                    maxWidth: 'none',
                    maxHeight: 'none'
                };
            };

            const downloadJPG = () => {
                const canvas = canvasRef.current;
                if (!canvas || canvasObjects.length === 0) return;
                const exportW = isPortrait ? 2480 : 3508;
                const exportH = isPortrait ? 3508 : 2480;
                const scaleFactorExport = exportW / A4_WIDTH;
                canvas.width = exportW;
                canvas.height = exportH;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, exportW, exportH);
                const drawOrder = [...canvasObjects].reverse();
                let loaded = 0;
                drawOrder.forEach(obj => {
                    const img = new Image();
                    img.src = obj.url;
                    img.onload = () => {
                        const dX = obj.x * scaleFactorExport;
                        const dY = obj.y * scaleFactorExport;
                        const dW = obj.width * scaleFactorExport;
                        const dH = obj.height * scaleFactorExport;
                        const isRotated = (obj.imgRotation / 90) % 2 !== 0;
                        const effectiveImgW = isRotated ? obj.imgH : obj.imgW;
                        const effectiveImgH = isRotated ? obj.imgW : obj.imgH;
                        const scale = Math.min(dW / effectiveImgW, dH / effectiveImgH);
                        const finalW = obj.imgW * scale;
                        const finalH = obj.imgH * scale;

                        ctx.save();
                        ctx.translate(dX + dW / 2, dY + dH / 2);
                        ctx.rotate((obj.imgRotation * Math.PI) / 180);
                        ctx.drawImage(img, -finalW / 2, -finalH / 2, finalW, finalH);
                        ctx.restore();

                        loaded++;
                        if (loaded === canvasObjects.length) {
                            const link = document.createElement('a');
                            link.download = `Layout_A4_${Date.now()}.jpg`;
                            link.href = canvas.toDataURL('image/jpeg', 0.95);
                            link.click();
                        }
                    };
                });
            };

            return (
                <div className="flex flex-col md:flex-row h-screen bg-slate-950 text-slate-100 font-sans overflow-hidden text-xs sm:text-sm" onMouseMove={handleMouseMove} onMouseUp={handleMouseUp}>
                    {/* 左側面板 */}
                    <div className="w-full md:w-56 bg-slate-900 border-r border-slate-800 flex flex-col shadow-2xl z-20 shrink-0">
                        <div className="p-4 border-b border-slate-800">
                            <h1 className="text-xl font-black text-indigo-400 mb-3 italic tracking-tighter uppercase">排版編輯器</h1>
                            <label className="flex flex-col items-center justify-center w-full h-16 border-2 border-dashed border-slate-700 rounded-2xl cursor-pointer hover:bg-slate-800 hover:border-indigo-500 transition-all group shadow-inner">
                                <Icon name="upload" size={20} className="mb-1 text-slate-500 group-hover:text-indigo-400" />
                                <span className="text-[10px] text-slate-400 font-black uppercase tracking-tighter">上傳照片</span>
                                <input type="file" className="hidden" multiple accept="image/*" onChange={handleFileUpload} />
                            </label>
                        </div>

                        <div className="flex-1 flex flex-col overflow-hidden">
                            <div className="p-4 h-48 overflow-y-auto border-b border-slate-800 shrink-0 scrollbar-hide">
                                <h2 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3 border-l-2 border-indigo-500 pl-2">資源庫</h2>
                                <div className="grid grid-cols-3 gap-2">
                                    {uploadedImages.map(img => (
                                        <div key={img.id} onClick={() => addLayer(img)} className="relative aspect-square rounded-lg overflow-hidden bg-slate-800 cursor-pointer hover:ring-2 hover:ring-indigo-500 transition-all border border-slate-700 shadow-lg">
                                            <img src={img.url} className="w-full h-full object-cover opacity-70 hover:opacity-100" />
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="flex-1 flex flex-col overflow-hidden bg-slate-900/50">
                                <div className="p-4 border-b border-slate-800 sticky top-0 bg-slate-900 z-10">
                                    <h2 className="text-sm font-bold text-slate-400 uppercase tracking-widest border-l-2 border-indigo-500 pl-2">圖層 ({canvasObjects.length})</h2>
                                </div>
                                <div className="flex-1 overflow-y-auto p-2 space-y-2 scrollbar-hide">
                                    {canvasObjects.map((layer) => (
                                        <div key={layer.id} onClick={() => setSelectedId(layer.id)} className={`flex items-center gap-2 p-1.5 rounded-xl border transition-all cursor-pointer ${selectedId === layer.id ? 'bg-indigo-600/30 border-indigo-500 shadow-lg' : 'bg-slate-800/40 border-transparent hover:bg-slate-800'}`}>
                                            <div className="w-9 h-9 rounded bg-black overflow-hidden shrink-0 border border-slate-700 shadow-inner relative">
                                                <img src={layer.url} className="absolute left-1/2 top-1/2 max-w-[90%] max-h-[90%] object-contain -translate-x-1/2 -translate-y-1/2" style={{ transform: `translate(-50%, -50%) rotate(${layer.imgRotation}deg)` }} />
                                            </div>
                                            <select value={layer.type} onChange={(e) => updateLayerType(layer.id, e.target.value)} className="bg-slate-950 text-xs font-bold h-8 flex-1 rounded-md border border-slate-800 outline-none text-indigo-300 px-1 min-w-0 cursor-pointer" onClick={(e) => e.stopPropagation()}>
                                                <option value="1">1</option>
                                                <option value="1/2">1/2</option>
                                                <option value="1/4">1/4</option>
                                                <option value="1/8">1/8</option>
                                            </select>
                                            <div className="flex gap-0.5">
                                                <button onClick={(e) => { e.stopPropagation(); duplicateLayer(layer); }} className="p-1.5 text-slate-400 hover:text-emerald-400 transition-colors" title="複製"><Icon name="copy" size={16} /></button>
                                                <button onClick={(e) => { e.stopPropagation(); removeLayer(layer.id); }} className="p-1.5 text-slate-400 hover:text-red-400 transition-colors" title="刪除"><Icon name="trash-2" size={16} /></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 右側畫布 */}
                    <div className="flex-1 flex flex-col relative overflow-hidden">
                        <div className="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shadow-md z-10">
                            <div className="flex items-center gap-2">
                                <div className="flex items-center gap-1.5 bg-slate-950 p-1.5 rounded-xl border border-slate-800 mr-2">
                                    <button onClick={() => setIsPortrait(true)} className={`px-4 py-1.5 rounded-lg text-xs font-black transition-all flex items-center gap-2 ${isPortrait ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-500 hover:text-slate-300'}`}>
                                        <Icon name="smartphone" size={14} /> 直式
                                    </button>
                                    <button onClick={() => setIsPortrait(false)} className={`px-4 py-1.5 rounded-lg text-xs font-black transition-all flex items-center gap-2 ${!isPortrait ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-500 hover:text-slate-300'}`}>
                                        <Icon name="monitor" size={14} /> 橫式
                                    </button>
                                </div>
                                <button onClick={handleUndo} disabled={history.length === 0} className={`flex items-center gap-1.5 px-4 py-1.5 rounded-xl text-xs font-black transition-all border ${history.length > 0 ? 'bg-slate-800 border-slate-700 text-indigo-400 hover:bg-slate-700 active:scale-95' : 'bg-transparent border-slate-800 text-slate-700 cursor-not-allowed'}`}>
                                    <Icon name="undo-2" size={14} /> 回復
                                </button>
                            </div>
                            <button onClick={downloadJPG} disabled={canvasObjects.length === 0} className={`flex items-center gap-2 px-8 py-2.5 rounded-full text-sm font-black transition-all ${canvasObjects.length > 0 ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-xl shadow-emerald-900/20 active:scale-95' : 'bg-slate-800 text-slate-600 cursor-not-allowed'}`}>
                                <Icon name="download" size={18} /> 下載 JPG
                            </button>
                        </div>

                        <div ref={containerRef} className="flex-1 flex items-center justify-center bg-slate-950 p-6 overflow-hidden relative" onClick={() => setSelectedId(null)}>
                            <div ref={boardRef} className="bg-white shadow-[0_0_120px_rgba(0,0,0,1)] relative transition-all duration-300 ease-out border border-slate-800 flex-shrink-0" style={{ width: `${A4_WIDTH}px`, height: `${A4_HEIGHT}px`, transform: `scale(${scaleFactor})`, transformOrigin: 'center' }}>
                                <div className="absolute inset-0 pointer-events-none opacity-[0.05]" style={{ backgroundImage: `linear-gradient(#000 1.5px, transparent 1.5px), linear-gradient(90deg, #000 1.5px, transparent 1.5px)`, backgroundSize: `${A4_WIDTH / 4}px ${A4_HEIGHT / 8}px` }}></div>
                                {[...canvasObjects].reverse().map(obj => (
                                    <div key={obj.id} onMouseDown={(e) => handleMouseDown(e, obj.id)} className={`absolute cursor-move select-none group border-2 ${selectedId === obj.id ? 'border-indigo-500 ring-[15px] ring-indigo-500/10 z-50 shadow-2xl' : 'border-transparent hover:border-indigo-300/40'}`} style={{ left: `${obj.x}px`, top: `${obj.y}px`, width: `${obj.width}px`, height: `${obj.height}px` }}>
                                        <div className="w-full h-full bg-slate-100 flex items-center justify-center p-0 overflow-hidden pointer-events-none relative shadow-sm">
                                            <img src={obj.url} className="transition-transform duration-300 origin-center" style={getPreviewImageStyle(obj)} />
                                        </div>
                                        <div className="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none flex items-center justify-center z-[100]">
                                            <button onClick={(e) => toggleRotateGrid(e, obj.id)} className="absolute -top-4 -left-4 bg-indigo-600 text-white p-2.5 rounded-full shadow-2xl pointer-events-auto hover:bg-indigo-500 active:scale-90 border border-white/20 transition-transform" title="旋轉格子"><Icon name="rotate-cw" size={18} /></button>
                                            <button onClick={(e) => { e.stopPropagation(); removeLayer(obj.id); }} className="absolute -top-4 -right-4 bg-red-500 text-white p-2.5 rounded-full shadow-2xl pointer-events-auto hover:bg-red-400 active:scale-90 border border-white/20 transition-transform" title="刪除"><Icon name="x" size={18} /></button>
                                        </div>
                                        {selectedId === obj.id && (
                                            <div className="absolute -bottom-5 right-0 bg-indigo-600 text-white text-[10px] font-black px-2 py-0.5 rounded shadow-xl uppercase italic z-50">
                                                {obj.type} AUTO-MAX
                                            </div>
                                        )}
                                    </div>
                                ))}
                                {canvasObjects.length === 0 && (
                                    <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-200 pointer-events-none opacity-[0.05]">
                                        <Icon name="image" size={180} />
                                        <p className="text-4xl font-black tracking-[0.4em] mt-4 uppercase">Canvas Ready</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                    <canvas ref={canvasRef} className="hidden" />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
