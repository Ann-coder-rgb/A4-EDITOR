<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 排版編輯器</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        body { margin: 0; padding: 0; background-color: #020617; color: white; }
        
        /* 選取範圍邊框微光效果 */
        .selected-ring {
            box-shadow: 0 0 0 2px #7dd3fc, 0 0 20px rgba(125, 211, 252, 0.3);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useLayoutEffect } = React;

        /**
         * 穩定版 Icon 組件 - 內嵌 SVG
         * 提供冰川藍配色方案的圖示
         */
        const Icon = ({ name, size = 16, className = "" }) => {
            const icons = {
                'upload': <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></>,
                'download': <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>,
                'trash-2': <><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>,
                'copy': <><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>,
                'smartphone': <><rect width="10" height="14" x="7" y="5" rx="2" ry="2"/><line x1="12" x2="12" y1="18" y2="18"/></>,
                'monitor': <><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></>,
                'undo-2': <><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></>,
                'rotate-cw': <><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></>,
                'x': <><path d="M18 6 6 18"/><path d="M6 6l12 12"/></>,
                'image': <><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></>,
                'plus': <><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></>
            };

            return (
                <svg 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name] || null}
                </svg>
            );
        };

        const App = () => {
            const [uploadedImages, setUploadedImages] = useState([]); 
            const [canvasObjects, setCanvasObjects] = useState([]);   
            const [history, setHistory] = useState([]); 
            const [selectedId, setSelectedId] = useState(null);       
            const [draggingId, setDraggingId] = useState(null);
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
            const [isPortrait, setIsPortrait] = useState(true);
            const [scaleFactor, setScaleFactor] = useState(1); 
            
            const canvasRef = useRef(null);
            const boardRef = useRef(null);
            const containerRef = useRef(null);

            const BASE_WIDTH = 595;
            const BASE_HEIGHT = 842;
            const A4_WIDTH = isPortrait ? BASE_WIDTH : BASE_HEIGHT;
            const A4_HEIGHT = isPortrait ? BASE_HEIGHT : BASE_WIDTH;

            const saveHistory = (currentObjects) => {
                setHistory(prev => {
                    const newHistory = [JSON.stringify(currentObjects), ...prev];
                    return newHistory.slice(0, 20);
                });
            };

            const handleUndo = () => {
                if (history.length === 0) return;
                const [lastState, ...remainingHistory] = history;
                setCanvasObjects(JSON.parse(lastState));
                setHistory(remainingHistory);
            };

            const getBestImageRotation = (imgW, imgH, boxW, boxH) => {
                const scale0 = Math.min(boxW / imgW, boxH / imgH);
                const scale90 = Math.min(boxW / imgH, boxH / imgW);
                return scale90 > scale0 ? 90 : 0;
            };

            const calculateSmartSize = (type, currentPaperPortrait, isManualRotated = false) => {
                const pW = currentPaperPortrait ? BASE_WIDTH : BASE_HEIGHT;
                const pH = currentPaperPortrait ? BASE_HEIGHT : BASE_WIDTH;
                let w, h;
                switch (type) {
                    case '1': w = pW; h = pH; break;
                    case '1/2': 
                        if (currentPaperPortrait) { w = pW; h = pH / 2; }
                        else { w = pW / 2; h = pH; }
                        break;
                    case '1/4': w = pW / 2; h = pH / 2; break;
                    case '1/8':
                        if (currentPaperPortrait) { w = pW / 2; h = pH / 4; }
                        else { w = pW / 4; h = pH / 2; }
                        break;
                    default: w = pW / 4; h = pH / 4;
                }
                if (isManualRotated) return { width: h, height: w };
                return { width: w, height: h };
            };

            useEffect(() => {
                setCanvasObjects(prev => prev.map(obj => {
                    const { width, height } = calculateSmartSize(obj.type, isPortrait, obj.isManualRotated);
                    const bestRot = getBestImageRotation(obj.imgW, obj.imgH, width, height);
                    const newX = Math.min(obj.x, A4_WIDTH - width);
                    const newY = Math.min(obj.y, A4_HEIGHT - height);
                    return { 
                        ...obj, 
                        width, 
                        height, 
                        imgRotation: bestRot, 
                        x: Math.max(0, newX), 
                        y: Math.max(0, newY) 
                    };
                }));
            }, [isPortrait]);

            useLayoutEffect(() => {
                const updateScale = () => {
                    if (containerRef.current) {
                        const padding = 120; 
                        const availableW = containerRef.current.offsetWidth - padding;
                        const availableH = containerRef.current.offsetHeight - padding;
                        const scaleW = availableW / A4_WIDTH;
                        const scaleH = availableH / A4_HEIGHT;
                        const finalScale = Math.min(scaleW, scaleH);
                        setScaleFactor(finalScale > 1 ? 1 : finalScale); 
                    }
                };
                const observer = new ResizeObserver(updateScale);
                if (containerRef.current) observer.observe(containerRef.current);
                updateScale();
                return () => observer.disconnect();
            }, [A4_WIDTH, A4_HEIGHT, isPortrait]);

            const handleFileUpload = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            setUploadedImages(prev => [...prev, { 
                                id: Date.now() + Math.random(), 
                                url: event.target.result, 
                                w: img.width, 
                                h: img.height 
                            }]);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const addLayer = (imgAsset, type = '1/4') => {
                saveHistory(canvasObjects);
                const initialSize = calculateSmartSize(type, isPortrait, false);
                const isImgLandscape = imgAsset.w > imgAsset.h;
                const isBoxLandscape = initialSize.width > initialSize.height;
                const shouldRotateGrid = (type !== '1' && type !== '1/4' && isImgLandscape !== isBoxLandscape);
                const finalSize = shouldRotateGrid ? { width: initialSize.height, height: initialSize.width } : initialSize;
                const bestImgRot = getBestImageRotation(imgAsset.w, imgAsset.h, finalSize.width, finalSize.height);

                const newLayer = {
                    id: Date.now() + Math.random(),
                    url: imgAsset.url,
                    imgW: imgAsset.w,
                    imgH: imgAsset.h,
                    x: (A4_WIDTH - finalSize.width) / 2,
                    y: (A4_HEIGHT - finalSize.height) / 2,
                    width: finalSize.width,
                    height: finalSize.height,
                    type,
                    isManualRotated: shouldRotateGrid,
                    imgRotation: bestImgRot
                };
                setCanvasObjects(prev => [newLayer, ...prev]);
                setSelectedId(newLayer.id);
            };

            const duplicateLayer = (layer) => {
                saveHistory(canvasObjects);
                const newLayer = {
                    ...layer,
                    id: Date.now() + Math.random(),
                    x: Math.min(layer.x + 20, A4_WIDTH - layer.width),
                    y: Math.min(layer.y + 20, A4_HEIGHT - layer.height)
                };
                setCanvasObjects(prev => [newLayer, ...prev]);
                setSelectedId(newLayer.id);
            };

            const updateLayerType = (id, newType) => {
                saveHistory(canvasObjects);
                setCanvasObjects(prev => prev.map(obj => {
                    if (obj.id === id) {
                        const { width, height } = calculateSmartSize(newType, isPortrait, obj.isManualRotated);
                        const bestRot = getBestImageRotation(obj.imgW, obj.imgH, width, height);
                        return { ...obj, type: newType, width, height, imgRotation: bestRot };
                    }
                    return obj;
                }));
            };

            const toggleRotateGrid = (e, id) => {
                e.stopPropagation();
                saveHistory(canvasObjects);
                setCanvasObjects(prev => prev.map(obj => {
                    if (obj.id === id) {
                        const newState = !obj.isManualRotated;
                        const { width, height } = calculateSmartSize(obj.type, isPortrait, newState);
                        const bestRot = getBestImageRotation(obj.imgW, obj.imgH, width, height);
                        const newX = Math.min(obj.x, A4_WIDTH - width);
                        const newY = Math.min(obj.y, A4_HEIGHT - height);
                        return { ...obj, isManualRotated: newState, width, height, imgRotation: bestRot, x: Math.max(0, newX), y: Math.max(0, newY) };
                    }
                    return obj;
                }));
            };

            const removeLayer = (id) => {
                saveHistory(canvasObjects);
                setCanvasObjects(prev => prev.filter(obj => obj.id !== id));
                if (selectedId === id) setSelectedId(null);
            };

            const handleMouseDown = (e, id) => {
                e.stopPropagation();
                setSelectedId(id);
                saveHistory(canvasObjects);
                const rect = boardRef.current.getBoundingClientRect();
                const obj = canvasObjects.find(o => o.id === id);
                setDraggingId(id);
                setDragOffset({
                    x: (e.clientX - rect.left) / scaleFactor - obj.x,
                    y: (e.clientY - rect.top) / scaleFactor - obj.y
                });
            };

            const handleMouseMove = (e) => {
                if (!draggingId) return;
                const rect = boardRef.current.getBoundingClientRect();
                let newX = (e.clientX - rect.left) / scaleFactor - dragOffset.x;
                let newY = (e.clientY - rect.top) / scaleFactor - dragOffset.y;
                const draggingObj = canvasObjects.find(o => o.id === draggingId);
                if (!draggingObj) return;

                const snapThreshold = 12;
                [0, A4_WIDTH / 2, A4_WIDTH - draggingObj.width].forEach(snap => {
                    if (Math.abs(newX - snap) < snapThreshold) newX = snap;
                });
                [0, A4_HEIGHT / 2, A4_HEIGHT - draggingObj.height].forEach(snap => {
                    if (Math.abs(newY - snap) < snapThreshold) newY = snap;
                });

                newX = Math.max(0, Math.min(newX, A4_WIDTH - draggingObj.width));
                newY = Math.max(0, Math.min(newY, A4_HEIGHT - draggingObj.height));

                setCanvasObjects(prev => prev.map(obj => 
                    obj.id === draggingId ? { ...obj, x: newX, y: newY } : obj
                ));
            };

            const handleMouseUp = () => setDraggingId(null);

            const getPreviewImageStyle = (obj) => {
                const isRotated = (obj.imgRotation / 90) % 2 !== 0;
                const effectiveImgW = isRotated ? obj.imgH : obj.imgW;
                const effectiveImgH = isRotated ? obj.imgW : obj.imgH;
                const scale = Math.min(obj.width / effectiveImgW, obj.height / effectiveImgH);

                return {
                    width: `${obj.imgW}px`,
                    height: `${obj.imgH}px`,
                    transform: `translate(-50%, -50%) rotate(${obj.imgRotation}deg) scale(${scale})`,
                    position: 'absolute',
                    left: '50%',
                    top: '50%',
                    maxWidth: 'none',
                    maxHeight: 'none'
                };
            };

            const downloadJPG = () => {
                const canvas = canvasRef.current;
                if (!canvas || canvasObjects.length === 0) return;
                const exportW = isPortrait ? 2480 : 3508;
                const exportH = isPortrait ? 3508 : 2480;
                const scaleFactorExport = exportW / A4_WIDTH;
                canvas.width = exportW;
                canvas.height = exportH;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, exportW, exportH);
                const drawOrder = [...canvasObjects].reverse();
                let loaded = 0;
                drawOrder.forEach(obj => {
                    const img = new Image();
                    img.src = obj.url;
                    img.onload = () => {
                        const dX = obj.x * scaleFactorExport;
                        const dY = obj.y * scaleFactorExport;
                        const dW = obj.width * scaleFactorExport;
                        const dH = obj.height * scaleFactorExport;
                        const isRotated = (obj.imgRotation / 90) % 2 !== 0;
                        const effectiveImgW = isRotated ? obj.imgH : obj.imgW;
                        const effectiveImgH = isRotated ? obj.imgW : obj.imgH;
                        const scale = Math.min(dW / effectiveImgW, dH / effectiveImgH);
                        const finalW = obj.imgW * scale;
                        const finalH = obj.imgH * scale;

                        ctx.save();
                        ctx.translate(dX + dW / 2, dY + dH / 2);
                        ctx.rotate((obj.imgRotation * Math.PI) / 180);
                        ctx.drawImage(img, -finalW / 2, -finalH / 2, finalW, finalH);
                        ctx.restore();

                        loaded++;
                        if (loaded === canvasObjects.length) {
                            const link = document.createElement('a');
                            link.download = `Layout_A4_${Date.now()}.jpg`;
                            link.href = canvas.toDataURL('image/jpeg', 0.95);
                            link.click();
                        }
                    };
                });
            };

            return (
                <div className="flex flex-col md:flex-row h-screen bg-slate-950 text-slate-100 font-sans overflow-hidden text-xs sm:text-sm" onMouseMove={handleMouseMove} onMouseUp={handleMouseUp}>
                    
                    {/* 左側面板 - 高級灰搭配冰川藍點綴 */}
                    <div className="w-full md:w-64 bg-slate-900/80 border-r border-slate-800 flex flex-col shadow-2xl z-20 shrink-0 backdrop-blur-md">
                        <div className="p-5 border-b border-slate-800/50">
                            <h1 className="text-xl font-bold text-sky-400 mb-4 tracking-tighter uppercase">A4 排版編輯器</h1>
                            <label className="flex flex-col items-center justify-center w-full h-20 border-2 border-dashed border-slate-700 rounded-xl cursor-pointer hover:bg-slate-800 hover:border-sky-400/50 transition-all group shadow-inner">
                                <Icon name="upload" size={24} className="mb-1 text-slate-500 group-hover:text-sky-300" />
                                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">上傳照片</span>
                                <input type="file" className="hidden" multiple accept="image/*" onChange={handleFileUpload} />
                            </label>
                        </div>

                        <div className="flex-1 flex flex-col overflow-hidden">
                            {/* 資源庫 */}
                            <div className="p-4 h-52 overflow-y-auto border-b border-slate-800/50 shrink-0 scrollbar-hide bg-slate-900/30">
                                <h2 className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-3 flex items-center gap-2">
                                    <div className="w-1 h-3 bg-sky-400 rounded-full"></div> 資源庫
                                </h2>
                                <div className="grid grid-cols-3 gap-2">
                                    {uploadedImages.map(img => (
                                        <div key={img.id} onClick={() => addLayer(img)} className="relative aspect-square rounded-lg overflow-hidden bg-slate-800 cursor-pointer hover:ring-2 hover:ring-sky-400 transition-all border border-slate-700 shadow-lg group">
                                            <img src={img.url} className="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-opacity" />
                                            <div className="absolute inset-0 bg-sky-400/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                        </div>
                                    ))}
                                    {uploadedImages.length === 0 && (
                                        <div className="col-span-3 flex flex-col items-center justify-center py-6 opacity-20 border border-slate-800 rounded-lg">
                                            <Icon name="image" size={24} />
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* 圖層清單 */}
                            <div className="flex-1 flex flex-col overflow-hidden">
                                <div className="p-4 border-b border-slate-800/50 sticky top-0 bg-slate-900/50 z-10">
                                    <h2 className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] flex items-center gap-2">
                                        <div className="w-1 h-3 bg-sky-400 rounded-full"></div> 圖層清單 ({canvasObjects.length})
                                    </h2>
                                </div>
                                <div className="flex-1 overflow-y-auto p-3 space-y-3 scrollbar-hide">
                                    {canvasObjects.map((layer) => (
                                        <div key={layer.id} onClick={() => setSelectedId(layer.id)} className={`flex items-center gap-3 p-2 rounded-xl border transition-all cursor-pointer ${selectedId === layer.id ? 'bg-sky-400/10 border-sky-400/50 shadow-lg shadow-sky-950/20' : 'bg-slate-800/30 border-transparent hover:bg-slate-800'}`}>
                                            <div className="w-10 h-10 rounded-lg bg-black overflow-hidden shrink-0 border border-slate-700 shadow-inner relative">
                                                <img src={layer.url} className="absolute left-1/2 top-1/2 max-w-[90%] max-h-[90%] object-contain -translate-x-1/2 -translate-y-1/2" style={{ transform: `translate(-50%, -50%) rotate(${layer.imgRotation}deg)` }} />
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <select value={layer.type} onChange={(e) => updateLayerType(layer.id, e.target.value)} className="bg-slate-950/50 text-[10px] font-black h-7 w-full rounded border border-slate-700 outline-none text-sky-200 px-2 cursor-pointer hover:border-sky-400/50 transition-colors" onClick={(e) => e.stopPropagation()}>
                                                    <option value="1">1 (全幅)</option>
                                                    <option value="1/2">1/2</option>
                                                    <option value="1/4">1/4</option>
                                                    <option value="1/8">1/8</option>
                                                </select>
                                            </div>
                                            <div className="flex gap-1 shrink-0">
                                                <button onClick={(e) => { e.stopPropagation(); duplicateLayer(layer); }} className="w-7 h-7 flex items-center justify-center bg-slate-800/80 text-slate-400 hover:text-sky-300 hover:bg-sky-400/20 rounded-lg transition-all active:scale-90 border border-slate-700" title="複製圖層">
                                                    <Icon name="copy" size={14} />
                                                </button>
                                                <button onClick={(e) => { e.stopPropagation(); removeLayer(layer.id); }} className="w-7 h-7 flex items-center justify-center bg-slate-800/80 text-slate-400 hover:text-rose-400 hover:bg-rose-400/10 rounded-lg transition-all active:scale-90 border border-slate-700" title="刪除圖層">
                                                    <Icon name="trash-2" size={14} />
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 右側畫布區域 - 深空黑 */}
                    <div className="flex-1 flex flex-col relative overflow-hidden">
                        <div className="h-16 bg-slate-950/80 border-b border-slate-800/50 flex items-center justify-between px-8 shadow-md z-10 backdrop-blur-sm">
                            <div className="flex items-center gap-3">
                                <div className="flex items-center gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
                                    <button onClick={() => setIsPortrait(true)} className={`px-5 py-1.5 rounded-lg text-[10px] font-black transition-all flex items-center gap-2 tracking-widest ${isPortrait ? 'bg-sky-500 text-white shadow-lg shadow-sky-900/20' : 'text-slate-500 hover:text-slate-300'}`}>
                                        <Icon name="smartphone" size={14} /> 直式
                                    </button>
                                    <button onClick={() => setIsPortrait(false)} className={`px-5 py-1.5 rounded-lg text-[10px] font-black transition-all flex items-center gap-2 tracking-widest ${!isPortrait ? 'bg-sky-500 text-white shadow-lg shadow-sky-900/20' : 'text-slate-500 hover:text-slate-300'}`}>
                                        <Icon name="monitor" size={14} /> 橫式
                                    </button>
                                </div>
                                <button onClick={handleUndo} disabled={history.length === 0} className={`flex items-center gap-2 px-5 py-1.5 rounded-xl text-[10px] font-black transition-all border tracking-widest ${history.length > 0 ? 'bg-slate-900 border-slate-700 text-sky-400 hover:bg-slate-800 active:scale-95 shadow-lg shadow-black/40' : 'bg-transparent border-slate-800 text-slate-700 cursor-not-allowed opacity-50'}`}>
                                    <Icon name="undo-2" size={14} /> 回復
                                </button>
                            </div>
                            <button onClick={downloadJPG} disabled={canvasObjects.length === 0} className={`flex items-center gap-2 px-8 py-2 rounded-full text-xs font-black transition-all tracking-widest ${canvasObjects.length > 0 ? 'bg-sky-400 hover:bg-sky-300 text-slate-950 shadow-xl shadow-sky-400/10 active:scale-95' : 'bg-slate-800 text-slate-600 cursor-not-allowed opacity-50'}`}>
                                <Icon name="download" size={18} /> 下載 JPG 檔案
                            </button>
                        </div>

                        <div ref={containerRef} className="flex-1 flex items-center justify-center bg-slate-950 p-8 overflow-hidden relative" onClick={() => setSelectedId(null)}>
                            {/* 背景微光裝飾 */}
                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-sky-500/5 rounded-full blur-[120px] pointer-events-none"></div>

                            <div ref={boardRef} className="bg-white relative transition-transform duration-300 ease-out flex-shrink-0 shadow-[0_40px_100px_-20px_rgba(0,0,0,0.8)]" style={{ width: `${A4_WIDTH}px`, height: `${A4_HEIGHT}px`, transform: `scale(${scaleFactor})`, transformOrigin: 'center' }}>
                                {/* 輔助格線 - 極淡灰色 */}
                                <div className="absolute inset-0 pointer-events-none opacity-[0.03]" style={{ backgroundImage: `linear-gradient(#000 1px, transparent 1px), linear-gradient(90deg, #000 1px, transparent 1px)`, backgroundSize: `${A4_WIDTH / 4}px ${A4_HEIGHT / 8}px` }}></div>
                                
                                {[...canvasObjects].reverse().map(obj => (
                                    <div key={obj.id} onMouseDown={(e) => handleMouseDown(e, obj.id)} className={`absolute cursor-move select-none group border-2 transition-colors ${selectedId === obj.id ? 'border-sky-400 z-50 selected-ring' : 'border-transparent hover:border-sky-400/30'}`} style={{ left: `${obj.x}px`, top: `${obj.y}px`, width: `${obj.width}px`, height: `${obj.height}px` }}>
                                        <div className="w-full h-full bg-slate-50 flex items-center justify-center p-0 overflow-hidden pointer-events-none relative shadow-inner">
                                            <img src={obj.url} className="transition-transform duration-300 origin-center" style={getPreviewImageStyle(obj)} />
                                        </div>
                                        
                                        {/* 畫布控制圓形按鈕 - 冰川藍主題 */}
                                        <div className="absolute inset-0 opacity-0 group-hover:opacity-100 transition-all pointer-events-none flex items-center justify-center z-[100]">
                                            <button onClick={(e) => toggleRotateGrid(e, obj.id)} className="absolute -top-5 -left-5 w-10 h-10 bg-sky-500 text-white rounded-full shadow-2xl pointer-events-auto hover:bg-sky-400 active:scale-90 border-4 border-white flex items-center justify-center transition-all" title="旋轉格子 (橫/直)">
                                                <Icon name="rotate-cw" size={20} />
                                            </button>
                                            <button onClick={(e) => { e.stopPropagation(); removeLayer(obj.id); }} className="absolute -top-5 -right-5 w-10 h-10 bg-rose-500 text-white rounded-full shadow-2xl pointer-events-auto hover:bg-rose-400 active:scale-90 border-4 border-white flex items-center justify-center transition-all" title="刪除圖層">
                                                <Icon name="x" size={20} />
                                            </button>
                                        </div>

                                        {selectedId === obj.id && (
                                            <div className="absolute -bottom-6 right-0 bg-sky-500 text-white text-[9px] font-black px-2.5 py-1 rounded-sm shadow-xl uppercase tracking-tighter italic z-50">
                                                {obj.type} AUTO-LAYOUT
                                            </div>
                                        )}
                                    </div>
                                ))}

                                {canvasObjects.length === 0 && (
                                    <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-800 pointer-events-none opacity-[0.04]">
                                        <Icon name="image" size={180} />
                                        <p className="text-4xl font-black tracking-[0.4em] mt-4 uppercase">Ready to Create</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                    <canvas ref={canvasRef} className="hidden" />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
