<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>實現排版自由 🎉 </title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    
    <!-- 引入穩定且具備版本號的資源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>
    
    <!-- 設定 Tailwind 自訂奢華咖啡色調與暗黑模式設定 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            50: '#fdfcfb',
                            100: '#f8f5f0',
                            200: '#e4d3c5', // 高雅象牙白
                            300: '#d0b29a',
                            400: '#b28566',
                            500: '#8c5e3c',
                            600: '#70472b',
                            700: '#52331e', // 皮革暖褐
                            800: '#3a2212', // 濃縮咖啡
                            900: '#231309', // 極深碳褐
                            950: '#0f0804'  // 曜石咖啡黑
                        },
                        obsidian: {
                            800: '#1c1917',
                            900: '#0c0a09', // 曜石極黑
                            950: '#040404'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #040404; 
            color: #f8f5f0;
            overscroll-behavior-y: contain;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        /* 奢華金琥珀光暈選取框 */
        .selected-object {
            outline: 4px solid #d97706;
            outline-offset: -2px;
            box-shadow: 0 0 35px rgba(217, 119, 6, 0.45);
        }

        .menu-overlay {
            background: rgba(12, 10, 9, 0.85);
            backdrop-filter: blur(6px);
        }

        .library-drawer {
            background: linear-gradient(to top, #040404, #1c1917);
            border-top: 1px solid rgba(217, 119, 6, 0.15);
        }

        /* 按鈕奢華點擊動態 */
        .btn-active:active {
            transform: scale(0.95);
            filter: brightness(1.15);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- 強制 Babel 使用傳統編譯 -->
    <script type="text/babel" data-type="module">
        const { useState, useRef, useEffect, useLayoutEffect } = React;

        // 優雅自建 SVG 圖示庫
        const Icon = ({ name, size = 16, className = "" }) => {
            const icons = {
                'upload': <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></>,
                'download': <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>,
                'trash-2': <><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>,
                'copy': <><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>,
                'smartphone': <><rect width="10" height="14" x="7" y="5" rx="2" ry="2"/><line x1="12" x2="12" y1="18" y2="18"/></>,
                'monitor': <><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></>,
                'undo-2': <><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></>,
                'rotate-cw': <><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></>,
                'x': <><path d="M18 6 6 18"/><path d="M6 6l12 12"/></>,
                'image': <><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></>,
                'plus': <><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></>
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const App = () => {
            const [uploadedImages, setUploadedImages] = useState([]); 
            const [canvasObjects, setCanvasObjects] = useState([]);   
            const [history, setHistory] = useState([]); 
            const [selectedId, setSelectedId] = useState(null);       
            const [draggingId, setDraggingId] = useState(null);
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
            const [isPortrait, setIsPortrait] = useState(true);
            const [scaleFactor, setScaleFactor] = useState(1); 
            const [snapLines, setSnapLines] = useState([]); // 儲存當前磁吸對齊線 [{ type: 'v'|'h', val: 數字 }]
            
            const canvasRef = useRef(null);
            const boardRef = useRef(null);
            const containerRef = useRef(null);

            const BASE_WIDTH = 595;
            const BASE_HEIGHT = 842;
            const A4_WIDTH = isPortrait ? BASE_WIDTH : BASE_HEIGHT;
            const A4_HEIGHT = isPortrait ? BASE_HEIGHT : BASE_WIDTH;

            const saveHistory = (currentObjects) => {
                setHistory(prev => {
                    const newHistory = [JSON.stringify(currentObjects), ...prev];
                    return newHistory.slice(0, 20);
                });
            };

            const handleUndo = () => {
                if (history.length === 0) return;
                const [lastState, ...remainingHistory] = history;
                setCanvasObjects(JSON.parse(lastState));
                setHistory(remainingHistory);
                setSnapLines([]);
            };

            const calculateSmartSize = (type, currentPaperPortrait, isManualRotated = false) => {
                const pW = currentPaperPortrait ? BASE_WIDTH : BASE_HEIGHT;
                const pH = currentPaperPortrait ? BASE_HEIGHT : BASE_WIDTH;
                let w, h;
                switch (type) {
                    case '1': w = pW; h = pH; break;
                    case '1/2': if (currentPaperPortrait) { w = pW; h = pH / 2; } else { w = pW / 2; h = pH; } break;
                    case '1/4': w = pW / 2; h = pH / 2; break;
                    case '1/8': if (currentPaperPortrait) { w = pW / 2; h = pH / 4; } else { w = pW / 4; h = pH / 2; } break;
                    default: w = pW / 4; h = pH / 4;
                }
                if (isManualRotated) return { width: h, height: w };
                return { width: w, height: h };
            };

            const getBestImageRotation = (imgW, imgH, boxW, boxH) => {
                const scale0 = Math.min(boxW / imgW, boxH / imgH);
                const scale90 = Math.min(boxW / imgH, boxH / imgW);
                return scale90 > scale0 ? 90 : 0;
            };

            useEffect(() => {
                setCanvasObjects(prev => prev.map(obj => {
                    const { width, height } = calculateSmartSize(obj.type, isPortrait, obj.isManualRotated);
                    const bestRot = getBestImageRotation(obj.imgW, obj.imgH, width, height);
                    const newX = Math.min(obj.x, A4_WIDTH - width);
                    const newY = Math.min(obj.y, A4_HEIGHT - height);
                    return { ...obj, width, height, imgRotation: bestRot, x: Math.max(0, newX), y: Math.max(0, newY) };
                }));
            }, [isPortrait]);

            useLayoutEffect(() => {
                const updateScale = () => {
                    if (containerRef.current) {
                        const padding = 40; 
                        const availableW = containerRef.current.offsetWidth - padding;
                        const availableH = containerRef.current.offsetHeight - padding;
                        const scaleW = availableW / A4_WIDTH;
                        const scaleH = availableH / A4_HEIGHT;
                        setScaleFactor(Math.min(scaleW, scaleH)); 
                    }
                };
                window.addEventListener('resize', updateScale);
                updateScale();
                return () => window.removeEventListener('resize', updateScale);
            }, [A4_WIDTH, A4_HEIGHT]);

            const handleFileUpload = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            setUploadedImages(prev => [{ 
                                id: Date.now() + Math.random(), 
                                url: event.target.result, 
                                w: img.width, 
                                h: img.height 
                            }, ...prev]);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const addLayer = (imgAsset) => {
                saveHistory(canvasObjects);
                const type = '1/4';
                const size = calculateSmartSize(type, isPortrait, false);
                const bestImgRot = getBestImageRotation(imgAsset.w, imgAsset.h, size.width, size.height);
                const newLayer = {
                    id: Date.now() + Math.random(),
                    url: imgAsset.url,
                    imgW: imgAsset.w, imgH: imgAsset.h,
                    x: (A4_WIDTH - size.width) / 2, y: (A4_HEIGHT - size.height) / 2,
                    width: size.width, height: size.height,
                    type, isManualRotated: false, imgRotation: bestImgRot
                };
                setCanvasObjects(prev => [newLayer, ...prev]);
                setSelectedId(newLayer.id);
            };

            const handleMouseDown = (e, id) => {
                e.stopPropagation();
                setSelectedId(id);
                saveHistory(canvasObjects);
                const rect = boardRef.current.getBoundingClientRect();
                const obj = canvasObjects.find(o => o.id === id);
                setDraggingId(id);
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                setDragOffset({
                    x: (clientX - rect.left) / scaleFactor - obj.x,
                    y: (clientY - rect.top) / scaleFactor - obj.y
                });
            };

            // 優化一：智能磁吸與貼齊對齊演算法
            const handleMouseMove = (e) => {
                if (!draggingId) return;
                const rect = boardRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                let rawX = (clientX - rect.left) / scaleFactor - dragOffset.x;
                let rawY = (clientY - rect.top) / scaleFactor - dragOffset.y;
                
                const obj = canvasObjects.find(o => o.id === draggingId);
                const otherObjects = canvasObjects.filter(o => o.id !== draggingId);
                
                const snapThreshold = 12; // 磁吸感應半徑 (px)
                let snappedX = rawX;
                let snappedY = rawY;
                let activeLines = [];

                // 1. X 軸磁吸對齊計算 (邊緣與中心)
                let bestDiffX = snapThreshold;
                let finalSnapX = null;

                // 建立所有潛在的對齊參考點
                const xRefs = [
                    { value: 0, label: 'A4 左邊緣' },
                    { value: A4_WIDTH, label: 'A4 右邊緣' },
                    { value: A4_WIDTH / 2, label: 'A4 垂直中心線' }
                ];
                otherObjects.forEach(o => {
                    xRefs.push({ value: o.x, label: '物件左邊緣' });
                    xRefs.push({ value: o.x + o.width, label: '物件右邊緣' });
                    xRefs.push({ value: o.x + o.width / 2, label: '物件垂直中心線' });
                });

                // 本身物件的對齊感應點
                const xTargets = [
                    { value: rawX, offset: 0 }, // 物件左緣貼齊參考點
                    { value: rawX + obj.width, offset: -obj.width }, // 物件右緣貼齊參考點
                    { value: rawX + obj.width / 2, offset: -obj.width / 2 } // 物件中心貼齊參考點
                ];

                xTargets.forEach(target => {
                    xRefs.forEach(ref => {
                        const diff = Math.abs(target.value - ref.value);
                        if (diff < bestDiffX) {
                            bestDiffX = diff;
                            finalSnapX = ref.value + target.offset;
                            // 紀錄此時需要繪製的對齊線
                            activeLines.push({ type: 'v', val: ref.value });
                        }
                    });
                });

                if (finalSnapX !== null) {
                    snappedX = finalSnapX;
                    // 只保留最合適的對齊線
                    const bestLine = activeLines.find(l => l.type === 'v' && (l.val === snappedX || l.val === snappedX + obj.width || l.val === snappedX + obj.width/2));
                    activeLines = bestLine ? [bestLine] : activeLines.slice(-1);
                } else {
                    activeLines = activeLines.filter(l => l.type !== 'v');
                }

                // 2. Y 軸磁吸對齊計算 (邊緣與中心)
                let bestDiffY = snapThreshold;
                let finalSnapY = null;

                const yRefs = [
                    { value: 0, label: 'A4 頂邊緣' },
                    { value: A4_HEIGHT, label: 'A4 底邊緣' },
                    { value: A4_HEIGHT / 2, label: 'A4 水平中心線' }
                ];
                otherObjects.forEach(o => {
                    yRefs.push({ value: o.y, label: '物件頂邊緣' });
                    yRefs.push({ value: o.y + o.height, label: '物件底邊緣' });
                    yRefs.push({ value: o.y + o.height / 2, label: '物件水平中心線' });
                });

                const yTargets = [
                    { value: rawY, offset: 0 }, // 物件頂緣貼齊
                    { value: rawY + obj.height, offset: -obj.height }, // 物件底緣貼齊
                    { value: rawY + obj.height / 2, offset: -obj.height / 2 } // 物件水平中心貼齊
                ];

                yTargets.forEach(target => {
                    yRefs.forEach(ref => {
                        const diff = Math.abs(target.value - ref.value);
                        if (diff < bestDiffY) {
                            bestDiffY = diff;
                            finalSnapY = ref.value + target.offset;
                            activeLines.push({ type: 'h', val: ref.value });
                        }
                    });
                });

                if (finalSnapY !== null) {
                    snappedY = finalSnapY;
                    const bestLine = activeLines.find(l => l.type === 'h' && (l.val === snappedY || l.val === snappedY + obj.height || l.val === snappedY + obj.height/2));
                    if (bestLine) {
                        activeLines = [...activeLines.filter(l => l.type !== 'h'), bestLine];
                    }
                } else {
                    activeLines = activeLines.filter(l => l.type !== 'h');
                }

                // 更新磁吸輔助線與座標
                setSnapLines(activeLines);
                setCanvasObjects(prev => prev.map(o => o.id === draggingId ? { ...o, x: snappedX, y: snappedY } : o));
            };

            const handleMouseUp = () => {
                setDraggingId(null);
                setSnapLines([]); // 清除磁吸輔助對齊線
            };

            const updateType = (id, newType) => {
                saveHistory(canvasObjects);
                setCanvasObjects(prev => prev.map(o => {
                    if (o.id === id) {
                        const { width, height } = calculateSmartSize(newType, isPortrait, o.isManualRotated);
                        const bestRot = getBestImageRotation(o.imgW, o.imgH, width, height);
                        return { ...o, type: newType, width, height, imgRotation: bestRot };
                    }
                    return o;
                }));
            };

            const toggleRotate = (id) => {
                saveHistory(canvasObjects);
                setCanvasObjects(prev => prev.map(o => {
                    if (o.id === id) {
                        const newState = !o.isManualRotated;
                        const { width, height } = calculateSmartSize(o.type, isPortrait, newState);
                        const bestRot = getBestImageRotation(o.imgW, o.imgH, width, height);
                        return { ...o, isManualRotated: newState, width, height, imgRotation: bestRot };
                    }
                    return o;
                }));
            };

            const removeLayer = (id) => {
                saveHistory(canvasObjects);
                setCanvasObjects(prev => prev.filter(obj => obj.id !== id));
                if (selectedId === id) setSelectedId(null);
            };

            // 優化二：複製圖片時，自動移到最上層 + 轉移選取焦點
            const handleDuplicate = (e, obj) => {
                e.stopPropagation();
                saveHistory(canvasObjects);
                
                const newId = Date.now() + Math.random();
                const copiedObj = { 
                    ...obj, 
                    id: newId, 
                    x: Math.min(obj.x + 24, A4_WIDTH - obj.width), 
                    y: Math.min(obj.y + 24, A4_HEIGHT - obj.height) 
                };
                
                // 放入 prev 的最前端（確保圖層位於最上層）
                setCanvasObjects(prev => [copiedObj, ...prev]);
                
                // 強制將選取焦點切換到新複製出的物件上
                setSelectedId(newId);
            };

            const downloadJPG = () => {
                const canvas = canvasRef.current;
                const exportW = isPortrait ? 2480 : 3508;
                const exportH = isPortrait ? 3508 : 2480;
                const scale = exportW / A4_WIDTH;
                canvas.width = exportW; canvas.height = exportH;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, exportW, exportH);
                let loaded = 0;
                [...canvasObjects].reverse().forEach(obj => {
                    const img = new Image(); img.src = obj.url;
                    img.onload = () => {
                        const dW = obj.width * scale; const dH = obj.height * scale;
                        const isRot = (obj.imgRotation / 90) % 2 !== 0;
                        const imgScale = Math.min(dW / (isRot ? obj.imgH : obj.imgW), dH / (isRot ? obj.imgW : obj.imgH));
                        ctx.save();
                        ctx.translate(obj.x * scale + dW/2, obj.y * scale + dH/2);
                        ctx.rotate((obj.imgRotation * Math.PI) / 180);
                        ctx.drawImage(img, -obj.imgW * imgScale / 2, -obj.imgH * imgScale / 2, obj.imgW * imgScale, obj.imgH * imgScale);
                        ctx.restore();
                        if (++loaded === canvasObjects.length) {
                            const a = document.createElement('a'); a.download = `Layout_Export.jpg`;
                            a.href = canvas.toDataURL('image/jpeg', 0.9); a.click();
                        }
                    };
                });
            };

            return (
                <div className="flex flex-col h-screen overflow-hidden bg-obsidian-950 select-none touch-none">
                    {/* 精緻奢華風頁首 */}
                    <header className="h-14 bg-obsidian-900/90 border-b border-coffee-800/30 flex items-center justify-between px-4 z-[60] backdrop-blur-md">
                        <div className="flex items-center gap-3">
                            <h1 className="text-lg font-bold text-coffee-200 tracking-tighter flex items-center gap-2">
                                <span className="text-amber-500">🎉</span> 實現排版自由
                            </h1>
                            <label className="flex items-center gap-1.5 px-3 py-1.5 bg-coffee-800/20 border border-coffee-700/50 rounded-lg cursor-pointer hover:bg-coffee-800/40 active:scale-95 transition-all">
                                <Icon name="upload" size={14} className="text-coffee-300" />
                                <span className="text-xs font-bold text-coffee-200">上傳照片</span>
                                <input type="file" className="hidden" multiple accept="image/*" onChange={handleFileUpload} />
                            </label>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={handleUndo} disabled={history.length === 0} className={`p-2 rounded-lg border border-coffee-800/50 transition-all ${history.length > 0 ? 'bg-coffee-900/50 text-amber-500 hover:bg-coffee-900 active:scale-90' : 'opacity-20'}`}>
                                <Icon name="undo-2" size={18} />
                            </button>
                            <div className="flex p-0.5 bg-obsidian-950 rounded-lg border border-coffee-900">
                                <button onClick={() => setIsPortrait(true)} className={`p-1.5 rounded-md transition-all ${isPortrait ? 'bg-coffee-700 text-coffee-50 shadow-lg' : 'text-coffee-500 hover:text-coffee-300'}`}><Icon name="smartphone" size={16} /></button>
                                <button onClick={() => setIsPortrait(false)} className={`p-1.5 rounded-md transition-all ${!isPortrait ? 'bg-coffee-700 text-coffee-50 shadow-lg' : 'text-coffee-500 hover:text-coffee-300'}`}><Icon name="monitor" size={16} /></button>
                            </div>
                            <button onClick={downloadJPG} className="bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-obsidian-900 font-bold px-4 py-1.5 rounded-full text-xs shadow-lg active:scale-95 transition-all">
                                匯出高解析
                            </button>
                        </div>
                    </header>

                    {/* 主工作區畫布 */}
                    <main 
                        ref={containerRef} 
                        className="flex-1 relative flex items-center justify-center p-4 bg-obsidian-950 overflow-hidden"
                        onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onTouchMove={handleMouseMove} onTouchEnd={handleMouseUp}
                        onClick={() => setSelectedId(null)}
                    >
                        <div 
                            ref={boardRef} 
                            className="bg-white shadow-[0_25px_80px_rgba(0,0,0,0.85)] relative transition-transform duration-300 ease-out flex-shrink-0 border border-coffee-900/20" 
                            style={{ width: `${A4_WIDTH}px`, height: `${A4_HEIGHT}px`, transform: `scale(${scaleFactor})`, transformOrigin: 'center' }}
                        >
                            {/* 雅緻輕背景網格 */}
                            <div className="absolute inset-0 pointer-events-none opacity-[0.02]" style={{ backgroundImage: `linear-gradient(#000 1.5px, transparent 1.5px), linear-gradient(90deg, #000 1.5px, transparent 1.5px)`, backgroundSize: `${A4_WIDTH/4}px ${A4_HEIGHT/8}px` }}></div>
                            
                            {/* 智能磁吸輔助線渲染 */}
                            {snapLines.map((line, idx) => (
                                <div
                                    key={idx}
                                    className="absolute pointer-events-none z-[49]"
                                    style={{
                                        left: line.type === 'v' ? `${line.val}px` : '0',
                                        top: line.type === 'h' ? `${line.val}px` : '0',
                                        width: line.type === 'v' ? '1.5px' : '100%',
                                        height: line.type === 'h' ? '1.5px' : '100%',
                                        borderLeft: line.type === 'v' ? '1.5px dashed #d97706' : 'none',
                                        borderTop: line.type === 'h' ? '1.5px dashed #d97706' : 'none',
                                        opacity: 0.85
                                    }}
                                />
                            ))}

                            {/* 物件渲染 */}
                            {[...canvasObjects].reverse().map(obj => (
                                <div 
                                    key={obj.id} 
                                    onMouseDown={(e) => handleMouseDown(e, obj.id)} 
                                    onTouchStart={(e) => handleMouseDown(e, obj.id)}
                                    onClick={(e) => e.stopPropagation()}
                                    className={`absolute cursor-move select-none transition-all ${selectedId === obj.id ? 'selected-object z-50' : 'hover:outline hover:outline-2 hover:outline-amber-500/30'}`} 
                                    style={{ 
                                        left: `${obj.x}px`, 
                                        top: `${obj.y}px`, 
                                        width: `${obj.width}px`, 
                                        height: `${obj.height}px`,
                                        transition: draggingId === obj.id ? 'none' : 'width 0.2s, height 0.2s, transform 0.2s'
                                    }}
                                >
                                    <div className="w-full h-full bg-stone-100 flex items-center justify-center overflow-hidden relative">
                                        <img 
                                            src={obj.url} 
                                            className="pointer-events-none" 
                                            style={{
                                                width: `${obj.imgW}px`, height: `${obj.imgH}px`,
                                                transform: `rotate(${obj.imgRotation}deg) scale(${Math.min(obj.width / ((obj.imgRotation/90)%2?obj.imgH:obj.imgW), obj.height / ((obj.imgRotation/90)%2?obj.imgW:obj.imgH))})`,
                                                maxWidth: 'none', position: 'absolute'
                                            }}
                                        />

                                        {selectedId === obj.id && (
                                            <div 
                                                className="menu-overlay absolute inset-0 flex flex-col items-center justify-center gap-4 p-2 z-[110] animate-in fade-in duration-200"
                                                onMouseDown={(e) => {
                                                    if (e.target !== e.currentTarget) {
                                                        e.stopPropagation();
                                                    }
                                                }}
                                                onTouchStart={(e) => {
                                                    if (e.target !== e.currentTarget) {
                                                        e.stopPropagation();
                                                    }
                                                }}
                                            >
                                                {/* 版面尺寸選單 */}
                                                <div className="grid grid-cols-4 gap-2 w-full max-w-[280px]">
                                                    {['1', '1/2', '1/4', '1/8'].map(t => (
                                                        <button 
                                                            key={t}
                                                            onClick={(e) => { e.stopPropagation(); updateType(obj.id, t); }}
                                                            className={`h-11 flex items-center justify-center rounded-xl text-xs font-black btn-active transition-all ${obj.type === t ? 'bg-gradient-to-b from-amber-500 to-amber-600 text-obsidian-950 shadow-[0_0_15px_rgba(217,119,6,0.5)]' : 'bg-coffee-950/80 text-coffee-200 border border-coffee-800/40'}`}
                                                        >
                                                            {t}
                                                        </button>
                                                    ))}
                                                </div>

                                                {/* 工具操作列 */}
                                                <div className="flex items-center gap-2 w-full max-w-[280px]">
                                                    <button onClick={(e) => { e.stopPropagation(); toggleRotate(obj.id); }} className="flex-1 h-11 flex items-center justify-center bg-coffee-900/80 text-amber-500 border border-coffee-800/40 rounded-xl btn-active hover:bg-coffee-800 transition-all">
                                                        <Icon name="rotate-cw" size={20} />
                                                    </button>
                                                    
                                                    {/* 複製按鈕 */}
                                                    <button onClick={(e) => handleDuplicate(e, obj)} className="flex-1 h-11 flex items-center justify-center bg-coffee-900/80 text-emerald-400 border border-coffee-800/40 rounded-xl btn-active hover:bg-coffee-800 transition-all">
                                                        <Icon name="copy" size={20} />
                                                    </button>
                                                    
                                                    <button onClick={(e) => { e.stopPropagation(); removeLayer(obj.id); }} className="flex-1 h-11 flex items-center justify-center bg-red-950/40 text-red-400 border border-red-900/50 rounded-xl btn-active hover:bg-red-950/80 transition-all">
                                                        <Icon name="trash-2" size={20} />
                                                    </button>
                                                </div>
                                                
                                                <div className="text-[10px] text-coffee-400 font-bold tracking-[0.2em] uppercase mt-1">
                                                    拖曳空白處可移動
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}

                            {canvasObjects.length === 0 && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center text-coffee-800 pointer-events-none opacity-20">
                                    <Icon name="image" size={80} className="stroke-1" />
                                    <p className="text-sm font-bold tracking-[0.2em] mt-4 uppercase text-center px-4 line-height-relaxed">
                                        上傳照片並點選下方縮圖<br/>
                                    </p>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* 奢華暗夜風資源庫抽屜 */}
                    <footer className="library-drawer h-24 shrink-0 flex flex-col z-50">
                        <div className="px-4 py-1.5 flex items-center justify-between border-b border-coffee-950/40">
                            <h2 className="text-xs font-bold text-coffee-300 uppercase tracking-widest flex items-center gap-2">
                                <div className="w-1.5 h-3.5 bg-amber-500 rounded-full"></div> 相片資源庫
                            </h2>
                            <span className="text-[9px] font-bold text-coffee-500 tracking-tighter">庫存數: {uploadedImages.length}</span>
                        </div>
                        <div className="flex-1 overflow-x-auto overflow-y-hidden scrollbar-hide flex items-center px-4 gap-3">
                            {uploadedImages.map(img => (
                                <div 
                                    key={img.id} 
                                    onClick={() => addLayer(img)} 
                                    className="h-12 aspect-square rounded-xl overflow-hidden bg-coffee-950/50 border border-coffee-800/40 flex-shrink-0 active:scale-90 transition-all shadow-lg cursor-pointer group relative"
                                >
                                    <img src={img.url} className="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-all" />
                                    <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-amber-500/20 transition-all">
                                        <div className="p-1 bg-amber-500 rounded-full shadow-md"><Icon name="plus" size={10} className="text-obsidian-950" /></div>
                                    </div>
                                </div>
                            ))}
                            {uploadedImages.length === 0 && (
                                <div className="flex-1 flex items-center justify-center text-coffee-600 italic text-[10px] tracking-widest uppercase">
                                    請點選上方「上傳照片」按鈕新增
                                </div>
                            )}
                        </div>
                    </footer>

                    <canvas ref={canvasRef} className="hidden" />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
